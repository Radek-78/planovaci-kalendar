<!doctype html>
<html lang="cs">
  <head>
    <!-- Apps Script servíruje stránku v iframu; base target="_top" zajistí,
         že odkazy a přesměrování otevírají skutečné okno, ne vnořený rám. -->
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title><?= app.appName ?></title>
    <!-- Jediná externí závislost aplikace — ikony typů událostí (chipy v kalendáři,
         modal detailu dne). Verze připnutá napevno, ať se vzhled sám neposune.
         Aplikace zůstává funkční i při výpadku CDN — ikona nikdy nenese význam
         sama, vždy je doplněná textem (viz SPECIFIKACE.md, bezpečnostní bod 13). -->
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <?!= include('ui/styles'); ?>
  </head>

  <body data-page="<?= app.page ?>">

    <!--
      Sprite s ikonami. Všechny ikony jsou vložené přímo ve stránce (inline SVG),
      takže aplikace nezávisí na žádném externím serveru a funguje i bez internetu
      mimo Google. Odkazuje se na ně přes <use href="#i-nazev">.
    -->
    <svg class="sprite" aria-hidden="true" focusable="false">
      <!-- Firemní logo -->
      <symbol id="i-lidl" viewBox="0 0 115 115">
        <path fill="#0050aa" d="M1 1h113v113H1z"/>
        <path fill="#ffffff" d="M114 1v113H1V1h113m1-1H0v115h115V0z"/>
        <path fill="#fff000" fill-rule="evenodd" d="M57.5 7.38a50.12 50.12 0 1 0 50.12 50.14A50.14 50.14 0 0 0 57.5 7.38z"/>
        <path fill="#e60a14" fill-rule="evenodd" d="M54.39 58.91l-8.85-8.85-10.2 10.22v3.43l2.57-2.58 7.12 7.14-2.63 2.62 1.71 1.72 14.24-14.26v-3.42l-3.96 3.98z"/>
        <path fill="#0050aa" fill-rule="evenodd" d="M13.08 48.2h15.76v3.4h-2.63v11l9.13-5.08v9.31H13.08v-3.42h2.64V51.6h-2.64v-3.4zM79.53 48.2v3.4h2.64v11.81h-2.64v3.42h22.28v-9.31l-9.14 5.08v-11h2.64v-3.4H79.53z"/>
        <path fill="#e60a14" fill-rule="evenodd" d="M44.24 37.61a5.61 5.61 0 1 1-5.61 5.59 5.59 5.59 0 0 1 5.61-5.59z"/>
        <path fill="#e60a14" fill-rule="evenodd" d="M57.5 4A53.51 53.51 0 1 0 111 57.52 53.53 53.53 0 0 0 57.5 4zm0 103.63a50.12 50.12 0 1 1 50.12-50.1 50.13 50.13 0 0 1-50.12 50.09z"/>
        <path fill="#0050aa" fill-rule="evenodd" d="M70.75 48.2h-15v3.4h2.63v11.81h-2.66v3.42h15c11.14 0 11.28-18.63.03-18.63z"/>
        <path fill="#fff000" fill-rule="evenodd" d="M68.64 61h-.75v-7h.63c3.29 0 3.29 7 .12 7z"/>
      </symbol>

      <!-- Uživatel -->
      <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </symbol>

      <!-- Složka -->
      <symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
      </symbol>

      <!-- Fajfka -->
      <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </symbol>

      <!-- Kalendář (navigace + hlavička kalendáře) -->
      <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </symbol>

      <!-- Uživatelé (navigace) -->
      <symbol id="i-users" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 12c2.481 0 4.5-2.019 4.5-4.5S14.481 3 12 3 7.5 5.019 7.5 7.5 9.519 12 12 12m0-7.5c1.654 0 3 1.346 3 3s-1.346 3-3 3-3-1.346-3-3 1.346-3 3-3m9 15V21h-1.5v-1.5c0-1.93-1.57-3.5-3.5-3.5H8c-1.93 0-3.5 1.57-3.5 3.5V21H3v-1.5c0-2.757 2.243-5 5-5h8c2.757 0 5 2.243 5 5"/>
      </symbol>

      <!-- Nastavení (navigace) -->
      <symbol id="i-settings" viewBox="0 0 24 24" fill="currentColor">
        <path d="m20.359 11.571 2.321-3.095-2.274-3.938-3.883.359-.627-.361L14.266 1H9.734l-1.63 3.536-.627.361-3.883-.359L1.32 8.474l2.315 3.106.005.847-2.318 3.102 2.272 3.933 3.881-.358.635.368L9.734 23h4.531l1.625-3.529.635-.368 3.881.358 2.272-3.933-2.319-3.104zm.526 4.063-1.298 2.248-3.402-.315-1.459.848-1.422 3.087h-2.609l-1.422-3.087-1.459-.848-3.402.315-1.298-2.248 2.027-2.714-.009-1.84-2.021-2.71 1.3-2.251 3.4.314 1.453-.837 1.43-3.097h2.609l1.43 3.097 1.453.837 3.4-.314 1.3 2.25-2.028 2.704v1.849l2.026 2.712zM12 8.119A3.89 3.89 0 0 0 8.113 12 3.89 3.89 0 0 0 12 15.881 3.89 3.89 0 0 0 15.886 12 3.89 3.89 0 0 0 12 8.119m0 6.265A2.39 2.39 0 0 1 9.613 12 2.39 2.39 0 0 1 12 9.617 2.39 2.39 0 0 1 14.386 12 2.39 2.39 0 0 1 12 14.383z"/>
      </symbol>

      <!-- Šipky pro navigaci mezi měsíci -->
      <symbol id="i-chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </symbol>
    </svg>

    <script>
      /**
       * Data předaná ze serveru při vykreslení stránky (viz doGet v 99_main.js).
       * Obsahují jen veřejné údaje — název aplikace, verzi a stav inicializace.
       * Nikdy sem nepatří nic, co by nesměl vidět kdokoliv, kdo stránku otevře.
       */
      window.APP_BOOTSTRAP = <?!= bootstrapJson ?>;
    </script>

    <!-- Podle stavu aplikace se vykreslí buď průvodce, nebo aplikace. -->
    <? if (app.page === 'app') { ?>
      <?!= include('ui/view_app'); ?>
    <? } else { ?>
      <?!= include('ui/view_wizard'); ?>
    <? } ?>

    <!--
      Úvodní překryv. U aplikace je vidět hned od začátku a skryje se, jakmile
      dorazí data ze serveru; u průvodce se nezobrazuje vůbec, protože ten
      žádné čekání na začátku nemá.
    -->
    <div class="loader <?= app.page === 'app' ? 'is-visible' : '' ?>" id="appLoader" role="status" aria-live="polite">
      <div class="loader-inner">
        <svg class="loader-logo" viewBox="0 0 115 115" aria-hidden="true"><use href="#i-lidl"></use></svg>
        <strong><?= app.appName ?></strong>
        <span><?= app.appSubtitle ?></span>
        <p>Načítám data aplikace…</p>
        <div class="loader-dots" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
      <span class="loader-version"><?= app.version ?> · <?= app.releaseDate ?></span>
    </div>

    <!-- Místo pro krátké hlášky (toasty). -->
    <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>

    <?!= include('ui/core'); ?>
  </body>
</html>
