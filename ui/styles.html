    align-items: flex-start;
    border-bottom: 1px solid var(--line-soft);
    display: flex;
    gap: 12px;
    padding: 12px 4px;
  }

  .notify-item:last-child {
    border-bottom: none;
  }

  /* Jen s entityId (viz renderNotifyItem) — bez něj by klik neměl kam
     vést, tak se ani netváří jako tlačítko (žádný ukazatel, žádný hover). */
  .notify-item.is-clickable {
    cursor: pointer;
  }

  .notify-item.is-clickable:hover {
    background: var(--page);
  }

  .notify-item-icon {
    align-items: center;
    background: color-mix(in srgb, var(--notify-color, var(--muted)) 16%, white);
    border-radius: 8px;
    color: var(--notify-color, var(--muted));
    display: flex;
    flex-shrink: 0;
    height: 34px;
    justify-content: center;
    width: 34px;
  }

  .notify-item-icon i {
    font-size: 16px;
  }

  .notify-item-body {
    flex: 1;
    min-width: 0;
  }

  .notify-item-kicker {
    color: var(--notify-color, var(--muted));
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    margin: 0 0 3px;
    text-transform: uppercase;
  }

  .notify-item-text {
    color: var(--text);
    font-size: 13px;
    line-height: 1.4;
    margin: 0;
  }

  .notify-item-time {
    color: var(--muted);
    font-size: 11px;
    margin: 4px 0 0;
  }

  /* #notifyModal .modal-body je flex sloupec s pevnou výškou (viz výše) —
     stejný vzor jako .day-empty, prázdný stav se do ní sám vycentruje. */
  .notify-empty {
    align-items: center;
    color: var(--muted);
    display: flex;
    flex: 1;
    flex-direction: column;
    font-size: 13px;
    gap: 10px;
    justify-content: center;
    text-align: center;
  }

  .notify-empty i {
    font-size: 26px;
  }

  .notify-empty p {
    margin: 0;
  }

  /* ── Modal — detail JEDNÉ události: info + komentáře ve dvou sloupcích ──
     Pevná výška jako u #dayModal (konzistentní velikost oken), ale širší
     (.modal-wide) a rozdělená na dva sloupce. Sloupec s komentáři je sám
     o sobě flex, aby se seznam mohl posouvat a formulář zůstal přilepený
     dole — stejný vzor jako běžné chatovací okno. ── */

  #eventModal .modal-body {
    border-top: none;
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: 420px;
    padding: 0;
  }

  /* Barevný pruh nahoře váže celý panel k barvě typu události (--chip-color
     dědí z #eventModal, nastaveno v openEventModal) — stejný jazyk jako
     ikona v hlavičce a chipy v mřížce, aby okno nepůsobilo jako holý text. */
  .event-modal-info {
    border-right: 1px solid var(--line-soft);
    border-top: 3px solid var(--chip-color, var(--lidl-blue));
    overflow-y: auto;
    padding: 18px 20px;
  }

  .event-info-block {
    margin-bottom: 22px;
  }

  .event-info-block:last-child {
    margin-bottom: 0;
  }

  /* Stejný vzor jako .kicker jinde v appce — malý popisek nad hodnotou. */
  .event-info-label {
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    margin: 0 0 5px;
    text-transform: uppercase;
  }

  .event-info-value {
    color: var(--text);
    font-size: 16px;
    font-weight: 700;
    margin: 0;
  }

  .event-info-sub {
    color: var(--muted);
    font-size: 12px;
    margin: 2px 0 0;
    text-transform: capitalize;
  }

  .event-info-value-row {
    align-items: center;
    display: flex;
    gap: 9px;
    margin: 0;
  }

  .event-info-avatar {
    align-items: center;
    background: var(--page);
    border-radius: 50%;
    color: var(--lidl-blue);
    display: inline-flex;
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    height: 27px;
    justify-content: center;
    width: 27px;
  }

  .event-info-text {
    color: var(--text);
    font-size: 13px;
    line-height: 1.6;
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .event-info-text--empty {
    color: var(--muted);
    font-style: italic;
  }

  .event-modal-comments {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .event-comments-list {
    display: flex;
    flex: 1;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
    padding: 16px 20px;
  }

  /* Prázdný/chybový stav komentářů — ikona + text, stejný jazyk jako .view-placeholder. */
  .comments-empty,
  .comments-loading {
    align-items: center;
    color: var(--muted);
    display: flex;
    flex: 1;
    flex-direction: column;
    font-size: 13px;
    gap: 8px;
    justify-content: center;
    text-align: center;
  }

  .comments-empty i {
    color: var(--line);
    font-size: 28px;
  }

  .comments-empty p {
    line-height: 1.5;
    margin: 0;
  }

  .comment-item {
    background: var(--page);
    border-radius: 8px;
    padding: 8px 10px;
  }

  .comment-item-header {
    align-items: baseline;
    display: flex;
    gap: 8px;
    justify-content: space-between;
  }

  .comment-item-header strong {
    color: var(--lidl-dark-blue);
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .comment-item-meta {
    align-items: center;
    display: flex;
    flex-shrink: 0;
    gap: 4px;
  }

  .comment-item-time {
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
  }

  .comment-item-delete {
    align-items: center;
    background: transparent;
    border: none;
    border-radius: 4px;
    color: var(--muted);
    cursor: pointer;
    display: inline-flex;
    height: 20px;
    justify-content: center;
    width: 20px;
  }

  .comment-item-delete:hover {
    background: rgba(230, 10, 20, 0.1);
    color: var(--lidl-red);
  }

  .comment-item-delete:disabled {
    cursor: not-allowed;
    opacity: 0.6;
  }

  .comment-item-delete i {
    font-size: 12px;
  }

  .comment-item-text {
    color: var(--text);
    font-size: 13px;
    line-height: 1.5;
    margin: 4px 0 0;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .event-comment-form {
    border-top: 1px solid var(--line-soft);
    display: flex;
    flex-shrink: 0;
    gap: 8px;
    padding: 10px 14px;
  }

  .event-comment-form textarea {
    flex: 1;
    min-height: 38px;
    resize: none;
  }

  .event-comment-form .button-icon {
    align-items: center;
    background: var(--lidl-blue);
    border: none;
    border-radius: var(--radius);
    color: var(--white);
    cursor: pointer;
    display: inline-flex;
    flex-shrink: 0;
    height: 38px;
    justify-content: center;
    width: 38px;
  }

  .event-comment-form .button-icon:hover {
    background: var(--lidl-dark-blue);
  }

  .event-comment-form .button-icon:disabled {
    cursor: not-allowed;
    opacity: 0.5;
  }

  .event-comment-form .button-icon i {
    font-size: 15px;
  }

  /* ── Formulář nové události ───────────────────────────────────────────
     Popisky polí ("Od", "Typ"...) používají globální pravidlo pro label
     (viz začátek souboru) — malá verzálková šedá, žádná zvláštní třída
     navíc potřeba. Název stojí sám nahoře jako "hero" pole (větší písmo,
     bez boxu — je to jediné, co v kalendáři uvidí ostatní na první pohled,
     zaslouží si víc váhy než ostatní pole), pod ním dva sloupce
     (.event-form-columns) a Popis přes celou šířku dole. Šířka celého
     modalu je .modal-xwide (viz eventFormModal), stejná jako detail
     filiálky — dvousloupcový obsah ji vyplní, ne holé prázdné okolo úzkého
     jednosloupcového formuláře jako dřív. ── */

  /* Bez pevné výšky — přizpůsobí se skutečnému obsahu, jediný skutečný
     limit je .modal{max-height}. align-content: start drží skupiny nahoře,
     ať případné skrytí řádku s časem (viz .event-form-field--hidden níže)
     nezůstane s dírou uprostřed. */
  .event-form-body {
    align-content: start;
    display: grid;
    gap: 18px;
    overflow-y: auto;
    padding: 20px 24px;
  }

  /* Hero pole Název — bez boxu, jen větší a tučnější input, ať vizuálně
     vede formulář (stejný princip jako název události v Google Kalendáři
     apod.), ne jen další řádek stejné váhy jako všechny ostatní. */
  .event-form-title-field {
    gap: 8px;
  }

  .event-form-title-input {
    font-size: 17px;
    font-weight: 700;
    min-height: 50px;
    padding: 12px 16px;
  }

  /* Dva sloupce vedle sebe (Typ+Celý den / Termín) — vyplní šířku
     .modal-xwide, aby formulář vypadal jako promyšlený celek, ne úzký
     proužek uprostřed širokého okna. */
  .event-form-columns {
    display: grid;
    gap: 16px;
    grid-template-columns: 1fr 1fr;
  }

  /* Modré orámování nahoře — jen v tomhle formuláři (sdílené .field-group
     jinde v appce, např. formulář uživatele/wizard, se NEMĚNÍ), ať každá
     sekce (Typ události/Termín/Popis) působí jako samostatná vizuální
     karta, ne jeden splývající šedý blok jako dřív. */
  .event-form-body .field-group {
    border-top: 3px solid var(--lidl-blue);
    padding-top: 16px;
  }

  .event-form-row {
    display: grid;
    gap: 12px;
    grid-template-columns: 1fr 1fr;
  }

  /* Skrytí celého řádku s časem při "Celý den" — visibility, ne display:none.
     Prostor v layoutu zůstává rezervovaný, takže se prostor pod ním ani
     o pixel neposune (display:none by přepočítalo výšku a vše by se mírně
     posunulo — přesně to, co dřív vadilo). */
  .event-form-field--hidden {
    visibility: hidden;
  }

  .event-form-body textarea {
    resize: vertical;
  }

  /* "Celý den" jako přepínač (viz .toggle-switch níže), ne obyčejné
     zaškrtávátko — text vlevo, přepínač vpravo na stejném řádku (na
     rozdíl od ostatních polí formuláře, kde popisek stojí NAD polem —
     u binárního přepínače je to přirozenější, běžný vzor nastavení). */
  .event-form-toggle-field {
    align-items: center;
    display: flex;
    justify-content: space-between;
    padding-top: 6px;
  }

  .event-form-toggle-field > span:first-child {
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0;
    text-transform: none;
  }

  /* ── Přepínač (toggle switch) — obecná komponenta, použitá zatím jen
     u "Celý den" ve formuláři události, ale bez vazby na tenhle formulář
     konkrétně, jde použít i jinde. Skrytý checkbox + :checked ~ selektor
     na sourozenní track/knob, klávesnice i myš fungují jako u obyčejného
     zaškrtávátka. ── */
  .toggle-switch {
    display: inline-flex;
    flex-shrink: 0;
    position: relative;
  }

  .toggle-switch input {
    cursor: pointer;
    height: 100%;
    margin: 0;
    opacity: 0;
    position: absolute;
    width: 100%;
    z-index: 1;
  }

  .toggle-switch-track {
    background: var(--line);
    border-radius: 999px;
    display: inline-block;
    height: 24px;
    position: relative;
    transition: background 0.15s;
    width: 42px;
  }

  .toggle-switch-knob {
    background: var(--white);
    border-radius: 50%;
    box-shadow: 0 1px 3px rgba(0, 20, 80, 0.3);
    height: 18px;
    left: 3px;
    position: absolute;
    top: 3px;
    transition: transform 0.15s;
    width: 18px;
  }

  .toggle-switch input:checked ~ .toggle-switch-track {
    background: var(--lidl-blue);
  }

  .toggle-switch input:checked ~ .toggle-switch-track .toggle-switch-knob {
    transform: translateX(18px);
  }

  .toggle-switch input:focus-visible ~ .toggle-switch-track {
    box-shadow: 0 0 0 3px rgba(0, 83, 179, 0.2);
  }

  /* ── Výběr typu události (.type-picker) ────────────────────────────────
     Vlastní tlačítko + rozbalovací panel místo nativního <select> — ten
     neumí vedle popisku zobrazit i ikonu typu. Otevírání/zavírání stejný
     vzor jako .cal-month-picker (viz bindTypePicker), skutečná vybraná
     hodnota žije ve skrytém #eventFormType. */
  .type-picker {
    position: relative;
  }

  /* Tlačítko vypadá jako input/select (stejná výška, rámeček, radius) —
     appearance sjednocená se zbytkem formuláře, i když jde technicky
     o <button>, ne o skutečný input. */
  .type-picker-trigger {
    align-items: center;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--text);
    cursor: pointer;
    display: flex;
    font-size: 14px;
    gap: 8px;
    min-height: 38px;
    padding: 6px 10px;
    text-align: left;
    transition: border-color 0.15s;
    width: 100%;
  }

  .type-picker-trigger:hover {
    border-color: var(--lidl-blue);
  }

  .type-picker-trigger:focus-visible {
    box-shadow: 0 0 0 3px rgba(0, 83, 179, 0.2);
    border-color: var(--lidl-blue);
    outline: none;
  }

  /* Barevná dlaždice s ikonou typu — stejný jazyk jako .settings-row-icon
     (Nastavení → Typy událostí), jen menší, ať se vejde do výšky pole. */
  .type-picker-trigger-icon {
    align-items: center;
    background: var(--type-bg, var(--page));
    border-radius: 6px;
    color: var(--type-color, var(--muted));
    display: flex;
    flex-shrink: 0;
    height: 24px;
    justify-content: center;
    width: 24px;
  }

  .type-picker-trigger-icon i {
    font-size: 13px;
  }

  .type-picker-trigger-label {
    flex: 1;
    font-weight: 400;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .type-picker-caret {
    color: var(--muted);
    flex-shrink: 0;
    font-size: 13px;
  }

  /* Rozbalovací panel — stejný vizuální jazyk jako .cal-month-picker/
     .column-filter-popover (bílá karta, stín, zaoblení). Dva sloupce
     (viz .type-picker-option), ať se i běžný počet typů (7 výchozích +
     pár vlastních) vešel na výšku bez scrollování — max-height je jen
     pojistka pro krajní případ hodně vlastních typů, ne běžný stav. */
  .type-picker-menu {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 16px 40px rgba(0, 36, 102, 0.18);
    display: grid;
    gap: 4px;
    grid-template-columns: 1fr 1fr;
    left: 0;
