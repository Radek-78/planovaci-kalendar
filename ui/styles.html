<style>
  /* ══════════════════════════════════════════════════════════════════════
     styles.html — design systém aplikace

     Vychází z firemního stylu použitého v Planung Dashboardu a ve Výchozí
     aplikaci 2.0, aby na sebe aplikace vzhledově navazovaly.

     Pravidla:
       - barvy VŽDY přes proměnné z :root, nikdy natvrdo v pravidlech,
       - žlutá jen jako akcent, červená jen pro chyby a nebezpečné akce,
       - hodnoty barev musí souhlasit s CONFIG.theme v server/00_config.js.

     Fáze 1 obsahuje jen to, co potřebuje wizard a přechodová obrazovka.
     Styly kalendáře přibudou ve fázi 3.
     ══════════════════════════════════════════════════════════════════════ */

  :root {
    /* Firemní paleta */
    --lidl-blue: #0050aa;
    --lidl-dark-blue: #002466;
    --lidl-light-blue: #008cd2;
    --lidl-yellow: #fff000;
    --lidl-red: #e60a14;

    /* Neutrální plochy a text */
    --white: #ffffff;
    --page: #f0f4fa;
    --panel: #ffffff;
    --line: #dce5f0;
    --line-soft: #eaeff7;
    --text: #0d1b3e;
    --muted: #5e6e8a;
    --green: #007a45;

    --radius: 6px;
    --shadow: 0 2px 12px rgba(0, 36, 102, 0.08);
    --sidebar-width: 220px;

    /* Firemní font s náhradami pro počítače, kde nainstalovaný není. */
    --font: "Lidl Font Cond Pro", "Lidl Font Pro", "Aptos", "Segoe UI", sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
  }

  body {
    background: var(--page);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
  }

  button,
  input,
  textarea,
  select {
    font: inherit;
  }

  button {
    -webkit-tap-highlight-color: transparent;
  }

  /* Skryté SVG s definicemi ikon (sprite) — nesmí zabírat místo v layoutu. */
  .sprite {
    height: 0;
    position: absolute;
    width: 0;
  }

  /* Univerzální třída pro skrytí prvku. */
  .is-hidden {
    display: none !important;
  }

  /* ── Typografie ─────────────────────────────────────────────────────── */

  h1,
  h2,
  p {
    margin-top: 0;
  }

  h1 {
    color: var(--lidl-dark-blue);
    font-size: 26px;
    font-weight: 700;
    line-height: 1.15;
    margin-bottom: 6px;
  }

  h2 {
    color: var(--lidl-dark-blue);
    font-size: 16px;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 0;
  }

  /* Malý nadpis nad blokem — modrý, verzálky, výrazné prostrkání. */
  .kicker {
    color: var(--lidl-blue);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    margin: 0 0 5px;
    text-transform: uppercase;
  }

  /* ── Tlačítka ───────────────────────────────────────────────────────── */

  .button {
    align-items: center;
    border: 1px solid transparent;
    border-radius: var(--radius);
    cursor: pointer;
    display: inline-flex;
    font-size: 13px;
    font-weight: 700;
    gap: 7px;
    justify-content: center;
    min-height: 36px;
    padding: 7px 14px;
    transition: opacity 0.1s;
  }

  .button svg {
    height: 15px;
    width: 15px;
  }

  .button-primary {
    background: var(--lidl-blue);
    color: var(--white);
  }

  .button-primary:hover {
    background: var(--lidl-dark-blue);
  }

  .button-secondary {
    background: var(--white);
    border-color: var(--line);
    color: var(--lidl-dark-blue);
  }

  .button-secondary:hover {
    background: var(--page);
  }

  .button:active {
    opacity: 0.8;
    transform: translateY(1px);
  }

  .button:disabled {
    cursor: not-allowed;
    opacity: 0.6;
    transform: none;
  }

  /* Viditelné zaostření pro ovládání klávesnicí — nikdy nerušit bez náhrady. */
  .button:focus-visible,
  input:focus-visible,
  textarea:focus-visible {
    box-shadow: 0 0 0 3px rgba(0, 83, 179, 0.2);
    outline: none;
  }

  /* ── Formulářové prvky ──────────────────────────────────────────────── */

  label {
    color: var(--muted);
    display: grid;
    font-size: 11px;
    font-weight: 700;
    gap: 6px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  input,
  textarea {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 14px;
    min-height: 38px;
    padding: 9px 12px;
    transition: border-color 0.15s;
  }

  input:focus,
  textarea:focus {
    border-color: var(--lidl-blue);
    outline: none;
  }

  input::placeholder {
    color: #c8cdd6;
  }

  input:disabled {
    background: var(--page);
    color: var(--muted);
  }

  /* Chybný vstup: červený rámeček + krátké zatřesení, aby si toho šlo všimnout. */
  input.is-invalid,
  input.is-invalid:focus {
    animation: shake 0.35s ease;
    border-color: var(--lidl-red);
  }

  input.is-invalid-placeholder::placeholder {
    color: var(--lidl-red);
    opacity: 1;
  }

  @keyframes shake {
    0%   { transform: translateX(0); }
    20%  { transform: translateX(-6px); }
    40%  { transform: translateX(6px); }
    60%  { transform: translateX(-4px); }
    80%  { transform: translateX(4px); }
    100% { transform: translateX(0); }
  }

  .form-row-2 {
    display: grid;
    gap: 10px;
    grid-template-columns: 1fr 1fr;
  }

  /* Skupina souvisejících polí ve vlastním boxu s kickerem. */
  .field-group {
    background: var(--page);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    display: grid;
    gap: 10px;
    padding: 14px 16px;
  }

  .field-group .kicker {
    margin-bottom: 0;
  }

  /* ── Brána (wizard a obrazovka bez přístupu) ────────────────────────── */

  .gate {
    align-items: center;
    background-color: var(--lidl-blue);
    background-image: radial-gradient(circle, rgba(255, 255, 255, 0.12) 1px, transparent 1px);
    background-size: 28px 28px;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 48px 24px;
  }

  .gate-card {
    background: var(--panel);
    border-radius: var(--radius);
    box-shadow: 0 24px 80px rgba(0, 20, 80, 0.28), 0 4px 16px rgba(0, 20, 80, 0.12);
    max-width: 560px;
    overflow: hidden;
    width: 100%;
  }

  .gate-header {
    align-items: center;
    background-color: var(--lidl-dark-blue);
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 15px, rgba(255, 255, 255, 0.035) 15px, rgba(255, 255, 255, 0.035) 16px),
      repeating-linear-gradient(90deg, transparent, transparent 15px, rgba(255, 255, 255, 0.035) 15px, rgba(255, 255, 255, 0.035) 16px);
    display: flex;
    gap: 14px;
    overflow: hidden;
    padding: 16px 22px;
    position: relative;
  }

  /* Jemné světlo v rohu hlavičky — čistě dekorace, nesmí chytat kliknutí. */
  .gate-header::before {
    background:
      radial-gradient(circle at 105% 120%, rgba(255, 240, 0, 0.18) 0%, transparent 45%),
      radial-gradient(circle at 92% -20%, rgba(255, 255, 255, 0.06) 0%, transparent 40%);
    content: "";
    inset: 0;
    pointer-events: none;
    position: absolute;
  }

  .gate-header .gate-logo {
    background: var(--white);
    border-radius: var(--radius);
    flex-shrink: 0;
    height: 44px;
    padding: 3px;
    position: relative;
    width: 44px;
    z-index: 1;
  }

  .gate-header-text {
    min-width: 0;
    position: relative;
    z-index: 1;
  }

  .gate-header .kicker {
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 2px;
  }

  .gate-header h1 {
    color: var(--white);
    font-size: 18px;
    margin: 0;
  }

  .gate-actions {
    align-items: center;
    background: #f5f8fc;
    border-top: 1px solid var(--line-soft);
    display: flex;
    gap: 10px;
    padding: 14px 22px;
  }

  .gate-actions #wizNext {
    margin-left: auto;
  }

  /* Ve wizardu se tlačítko „Zpět" jen zneviditelní — kdyby zmizelo úplně,
     poskočilo by tlačítko „Pokračovat" doleva. */
  .gate-actions .is-invisible {
    visibility: hidden;
  }

  .gate-note {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.55;
    margin: 0;
  }

  .gate-warning {
    background: #fde8e8;
    border-left: 4px solid var(--lidl-red);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 13px;
    line-height: 1.5;
    padding: 10px 14px;
  }

  /* Řádek s ikonou, popiskem a hodnotou (e-mail, složka). */
  .info-row {
    align-items: center;
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    display: flex;
    gap: 14px;
    padding: 10px 14px;
  }

  .info-row svg {
    color: var(--lidl-blue);
    flex-shrink: 0;
    height: 18px;
    width: 18px;
  }

  .info-row > div {
    min-width: 0;
  }

  .info-row > div > span {
    color: var(--muted);
    display: block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 2px;
    text-transform: uppercase;
  }

  .info-row strong {
    display: block;
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ── Wizard ─────────────────────────────────────────────────────────── */

  .wizard-steps {
    border-bottom: 1px solid var(--line-soft);
    display: flex;
    list-style: none;
    margin: 0;
    padding: 14px 22px;
    transition: opacity 0.2s ease;
  }

  /* Během inicializace a na obrazovce úspěchu už kroky nedávají smysl. */
  .gate-card[data-state="progress"] .wizard-steps,
  .gate-card[data-state="success"] .wizard-steps {
    opacity: 0;
    pointer-events: none;
  }

  .wizard-steps li {
    align-items: center;
    color: var(--muted);
    display: flex;
    flex: 1;
    flex-direction: column;
    font-size: 10px;
    font-weight: 700;
    gap: 5px;
    letter-spacing: 0.04em;
    position: relative;
    text-align: center;
    text-transform: uppercase;
  }

  /* Spojnice mezi kroky — zmodrá, jakmile je předchozí krok hotový. */
  .wizard-steps li + li::before {
    background: var(--line-soft);
    content: "";
    height: 1px;
    left: calc(-50% + 13px);
    position: absolute;
    right: calc(50% + 13px);
    top: 12px;
    transition: background 0.3s ease;
  }

  .wizard-steps li.is-done + li::before {
    background: var(--lidl-blue);
  }

  .wizard-steps i {
    align-items: center;
    background: var(--line-soft);
    border-radius: 50%;
    color: var(--muted);
    display: inline-flex;
    flex-shrink: 0;
    font-size: 11px;
    font-style: normal;
    height: 24px;
    justify-content: center;
    position: relative;
    transition: background 0.2s ease, color 0.2s ease;
    width: 24px;
    z-index: 1;
  }

  .wizard-steps li.is-active {
    color: var(--lidl-dark-blue);
  }

  .wizard-steps li.is-active i {
    background: var(--lidl-yellow);
    color: var(--lidl-dark-blue);
  }

  .wizard-steps li.is-done i {
    background: var(--lidl-blue);
    color: var(--white);
  }

  /* Pevná výška těla — karta pak mezi kroky „neposkakuje". */
  .wizard-body {
    height: 320px;
    overflow-x: hidden;
    overflow-y: auto;
  }

  .wizard-panel {
    display: none;
  }

  .wizard-panel.is-active {
    display: grid;
    gap: 16px;
    padding: 20px 22px;
  }

  .wizard-panel label {
    gap: 4px;
  }

  @keyframes wizSlideForward {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  @keyframes wizSlideBack {
    from { opacity: 0; transform: translateX(-20px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .wizard-body[data-dir="forward"] .wizard-panel.is-active {
    animation: wizSlideForward 0.25s ease;
  }

  .wizard-body[data-dir="back"] .wizard-panel.is-active {
    animation: wizSlideBack 0.25s ease;
  }

  /* Souhrn před dokončením. */
  .summary-list {
    display: grid;
    gap: 8px;
    margin: 0;
  }

  .summary-list div {
    align-items: baseline;
    border-bottom: 1px solid var(--line-soft);
    display: flex;
    gap: 12px;
    justify-content: space-between;
    padding-bottom: 8px;
  }

  .summary-list dt {
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .summary-list dd {
    font-size: 13px;
    font-weight: 700;
    margin: 0;
    text-align: right;
    word-break: break-word;
  }

  /* Průběh inicializace — jednotlivé kroky s kolečkem a fajfkou. */
  .wizard-progress {
    display: grid;
    gap: 6px;
    justify-items: start;
    padding: 4px 0;
  }

  .wizard-progress-title {
    color: var(--muted);
    font-size: 12px;
    margin: 0 0 6px;
  }

  .wiz-step {
    align-items: center;
    color: var(--muted);
    display: flex;
    font-size: 13px;
    gap: 12px;
    padding: 6px 0;
    transition: color 0.2s ease;
    width: 100%;
  }

  .wiz-step.is-active,
  .wiz-step.is-done {
    color: var(--text);
  }

  .wiz-step-icon {
    align-items: center;
    border-radius: 50%;
    display: inline-flex;
    flex-shrink: 0;
    height: 22px;
    justify-content: center;
    width: 22px;
  }

  .wiz-step .wiz-step-icon::after {
    border: 2px solid var(--line-soft);
    border-radius: 50%;
    content: "";
    display: block;
    height: 14px;
    transition: border-color 0.2s ease;
    width: 14px;
  }

  .wiz-step.is-active .wiz-step-icon::after {
    animation: spin 0.7s linear infinite;
    border-color: var(--lidl-blue);
    border-top-color: transparent;
  }

  .wiz-step.is-done .wiz-step-icon {
    background: var(--lidl-blue);
    color: var(--white);
  }

  .wiz-step.is-done .wiz-step-icon::after {
    border: none;
    color: var(--white);
    content: "✓";
    font-size: 11px;
    font-weight: 700;
    height: auto;
    width: auto;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Obrazovka úspěchu. */
  .wizard-success {
    display: grid;
    gap: 10px;
    justify-items: center;
    padding: 10px 0 4px;
    text-align: center;
  }

  .wizard-success .success-icon {
    align-items: center;
    background: var(--lidl-yellow);
    border-radius: 50%;
    color: var(--lidl-dark-blue);
    display: inline-flex;
    height: 52px;
    justify-content: center;
    margin-bottom: 4px;
    width: 52px;
  }

  .wizard-success .success-icon svg {
    height: 24px;
    width: 24px;
  }

  .wizard-success h2 {
    margin: 0;
  }

  .wizard-success a {
    color: var(--lidl-blue);
    font-weight: 700;
  }

  /* ── Obrazovka „bez přístupu" — centrovaná karta ─────────────────────── */

  .app-shell {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .app-main {
    display: flex;
    flex: 1;
    justify-content: center;
    padding: 48px 24px;
  }

  .app-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: grid;
    gap: 20px;
    height: fit-content;
    max-width: 560px;
    padding: 28px 30px;
    width: 100%;
  }

  .app-footer {
    align-items: center;
    background: var(--white);
    border-top: 1px solid var(--line);
    color: var(--muted);
    display: flex;
    font-size: 11px;
    gap: 10px;
    justify-content: space-between;
    padding: 10px 20px;
  }

  .app-footer strong {
    color: var(--lidl-dark-blue);
  }

  /* ── Aplikace (přístup povolen) — sidebar + hlavní obsah ─────────────
     Vzhled portován z Výchozí aplikace 2.0 (ui/styles.html), aby si obě
     aplikace vizuálně odpovídaly. Rozdíl oproti šabloně: bez sbalitelného
     sidebaru (sidebar-toggle) — se třemi položkami menu nemá smysl. ── */

  .app {
    display: grid;
    grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
    min-height: 100vh;
  }

  .sidebar {
    background: var(--lidl-dark-blue);
    color: var(--white);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow-y: auto;
    position: sticky;
    top: 0;
  }

  .brand {
    align-items: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    display: grid;
    gap: 10px;
    grid-template-columns: 36px minmax(0, 1fr);
    min-height: 58px;
    padding: 10px 11px;
  }

  .brand-logo {
    display: block;
    height: 36px;
    width: 36px;
  }

  .brand-text {
    min-width: 0;
  }

  .brand-text strong {
    display: block;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.2;
    white-space: nowrap;
  }

  .brand-text small {
    color: rgba(255, 255, 255, 0.55);
    display: block;
    font-size: 11px;
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .navigation {
    display: flex;
    flex: 1;
    flex-direction: column;
    gap: 2px;
    padding: 12px 10px;
  }

  .nav-link {
    align-items: center;
    background: transparent;
    border: 0;
    border-radius: var(--radius);
    color: rgba(255, 255, 255, 0.72);
    cursor: pointer;
    display: flex;
    font-size: 14px;
    gap: 10px;
    min-height: 40px;
    padding: 9px 10px;
    text-align: left;
    transition: background 0.12s, color 0.12s;
    width: 100%;
  }

  .nav-link:hover {
    background: rgba(255, 255, 255, 0.08);
    color: var(--white);
  }

  .nav-link svg {
    flex-shrink: 0;
    height: 18px;
    width: 18px;
  }

  .nav-link span {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .nav-link.is-active {
    background: var(--lidl-yellow);
    color: var(--lidl-dark-blue);
    font-weight: 700;
  }

  .nav-link.is-active:hover {
    background: var(--lidl-yellow);
    color: var(--lidl-dark-blue);
  }

  .sidebar-user {
    align-items: center;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    gap: 10px;
    padding: 14px 16px;
  }

  .sidebar-user > span:not(.avatar) {
    flex: 1;
    min-width: 0;
  }

  .sidebar-user strong {
    display: block;
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .sidebar-user small {
    color: var(--lidl-yellow);
    display: block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    margin-top: 1px;
    overflow: hidden;
    text-overflow: ellipsis;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .avatar {
    align-items: center;
    background: var(--lidl-yellow);
    border-radius: var(--radius);
    color: var(--lidl-dark-blue);
    display: inline-flex;
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 700;
    height: 34px;
    justify-content: center;
    width: 34px;
  }

  .main {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  /* ── Panely hlavního obsahu ──────────────────────────────────────────── */

  .view-panel {
    display: none;
    flex: 1;
    flex-direction: column;
    min-height: 0;
  }

  .view-panel.is-active {
    display: flex;
  }

  /* Prázdný stav pro sekce, které ještě nemají obsah (Uživatelé, Nastavení). */
  .view-placeholder {
    align-items: center;
    color: var(--muted);
    display: flex;
    flex: 1;
    flex-direction: column;
    gap: 10px;
    justify-content: center;
    padding: 40px;
    text-align: center;
  }

  .view-placeholder svg {
    color: var(--line);
    height: 40px;
    width: 40px;
  }

  .view-placeholder p {
    font-size: 13px;
    margin: 0;
    max-width: 320px;
  }

  /* ── Kalendář — hlavička s navigací měsíců ────────────────────────────
     Rozvržení mřížky vychází z Planung Dashboard → PMS → Plánovací kalendář,
     barvy a proporce upravené na paletu této aplikace. ── */

  .cal-header {
    padding: 16px 20px 0;
  }

  .cal-nav {
    align-items: center;
    display: flex;
    gap: 8px;
  }

  /* Ikona kalendáře a odznak se souhrnem jsou v témže řádku jako navigace —
     souhrn je poslední prvek a "margin-left: auto" ho odtlačí doprava. */
  .cal-month-picker-wrap {
    position: relative;
  }

  .cal-nav-btn {
    align-items: center;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--lidl-blue);
    cursor: pointer;
    display: inline-flex;
    height: 32px;
    justify-content: center;
    width: 32px;
  }

  .cal-nav-btn:hover {
    background: var(--page);
  }

  .cal-nav-btn svg {
    height: 15px;
    width: 15px;
  }

  .cal-nav-today {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--lidl-dark-blue);
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    height: 32px;
    padding: 0 12px;
  }

  .cal-nav-today:hover {
    background: var(--page);
  }

  .cal-month-label {
    color: var(--lidl-dark-blue);
    font-size: 15px;
    font-weight: 700;
    margin-left: 6px;
    text-transform: capitalize;
  }

  /* Souhrn počtu událostí — odznak na konci navigačního řádku, ne holý text. */
  .cal-summary {
    align-items: center;
    background: var(--page);
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--lidl-blue);
    display: inline-flex;
    font-size: 12px;
    font-weight: 700;
    gap: 6px;
    margin-left: auto;
    padding: 5px 12px;
  }

  .cal-summary i {
    font-size: 13px;
  }

  /* ── Přepínač měsíce/roku (vlastní, ne prohlížečový) ──────────────────── */

  .cal-month-picker {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 16px 40px rgba(0, 36, 102, 0.18);
    left: 0;
    padding: 10px;
    position: absolute;
    top: calc(100% + 6px);
    width: 220px;
    z-index: 30;
  }

  .cal-month-picker-year {
    align-items: center;
    display: flex;
    justify-content: space-between;
    padding: 0 2px;
  }

  .cal-month-picker-year span {
    color: var(--lidl-dark-blue);
    font-size: 13px;
    font-weight: 700;
  }

  .cal-month-picker-year-btn {
    align-items: center;
    background: transparent;
    border: none;
    border-radius: var(--radius);
    color: var(--muted);
    cursor: pointer;
    display: inline-flex;
    height: 26px;
    justify-content: center;
    width: 26px;
  }

  .cal-month-picker-year-btn:hover {
    background: var(--page);
    color: var(--lidl-blue);
  }

  .cal-month-picker-year-btn svg {
    height: 13px;
    width: 13px;
  }

  .cal-month-picker-grid {
    display: grid;
    gap: 4px;
    grid-template-columns: repeat(3, 1fr);
    margin-top: 8px;
  }

  .cal-month-picker-month {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--text);
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    padding: 8px 0;
    text-align: center;
    text-transform: capitalize;
  }

  .cal-month-picker-month:hover {
    background: var(--page);
  }

  .cal-month-picker-month.is-current {
    background: var(--lidl-blue);
    color: var(--white);
    font-weight: 700;
  }

  /* Dnešní měsíc, pokud zrovna není ten zobrazený — jen tenký žlutý obrys. */
  .cal-month-picker-month.is-today-month {
    border-color: var(--lidl-yellow);
  }

  /* ── Kalendář — mřížka (varianta „C — výrazná, barevné pásy") ─────────
     Vybráno ze tří navržených směrů (viz navrhy/navrhy-kalendare.html):
     sloupec týdnů jako tmavě modrý pruh, dny jako oddělené zaoblené karty
     s mezerou mezi sebou (ne dotýkající se dlaždice jako předtím), dnešek
     zvýrazněný žlutým odznakem kolem čísla (firemní akcent), podbarvení
     karty a zmodrání rámečku při najetí myší. ── */

  .cal-grid-wrap {
    background: var(--page);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    flex: 1;
    margin: 16px 20px 20px;
    min-height: 0;
    overflow: hidden auto;
    padding: 10px;
  }

  .cal-grid {
    display: grid;
    gap: 6px;
    grid-template-columns: 44px repeat(7, 1fr);
    grid-template-rows: 26px repeat(6, minmax(64px, 1fr));
    height: 100%;
  }

  .cal-weekhead,
  .cal-dayhead {
    align-items: center;
    color: var(--muted);
    display: flex;
    font-size: 11px;
    font-weight: 700;
    justify-content: center;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* Pruh s číslem kalendářního týdne — roztažený na celou výšku řádku
     (grid stretch je výchozí chování), vlastní padding dává odstup od
     jeho vlastních okrajů, ne od okrajů buňky. */
  .cal-weeknum-cell {
    align-items: center;
    background: var(--lidl-dark-blue);
    border-radius: 8px;
    color: rgba(255, 255, 255, 0.65);
    display: flex;
    flex-direction: column;
    font-size: 9px;
    font-weight: 700;
    justify-content: center;
    padding: 4px;
  }

  .cal-weeknum-cell b {
    color: var(--white);
    font-size: 14px;
  }

  /* Aktuální kalendářní týden — žlutá, stejný akcent jako u dnešního dne. */
  .cal-weeknum-cell.is-current-week {
    background: var(--lidl-yellow);
    color: var(--lidl-dark-blue);
  }

  .cal-weeknum-cell.is-current-week b {
    color: var(--lidl-dark-blue);
  }

  .cal-cell {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 8px;
    min-width: 0;
    overflow: hidden;
    padding: 7px;
    position: relative;
    transition: background 0.12s, border-color 0.12s;
  }

  .cal-cell:hover {
    background: #eaf3ff;
    border-color: var(--lidl-blue);
  }

  .cal-cell.is-weekend {
    background: var(--page);
  }

  .cal-cell.is-weekend:hover {
    background: #e3ecf8;
  }

  .cal-cell.is-other-month {
    background: transparent;
    border-style: dashed;
  }

  .cal-cell.is-other-month:hover {
    background: var(--page);
  }

  .cal-cell.is-other-month .cal-daynum {
    color: #c8cdd6;
  }

  .cal-cell.is-past .cal-daynum {
    color: var(--muted);
  }

  .cal-daynum {
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
  }

  /* Dnešek — celá karta výrazně orámovaná žlutou (firemní akcent), aby bylo
     na první pohled jasné, který den je dnešní, i mezi víkendovými dny.
     Pravidlo musí být v CSS AŽ ZA .is-weekend/.is-past, aby při souběhu
     (dnešek o víkendu) vyhrálo — obě mají stejnou specificitu, rozhoduje
     pořadí v souboru. */
  .cal-cell.is-today {
    background: #fffdf0;
    border-color: var(--lidl-yellow);
    border-width: 2px;
    padding: 6px; /* o 1px méně než běžná buňka — kompenzuje silnější rámeček */
  }

  .cal-cell.is-today:hover {
    background: #fff8d6;
  }

  /* Dnešek — žlutý kolečkový odznak kolem čísla, ne rámeček celé buňky. */
  .cal-cell.is-today .cal-daynum {
    align-items: center;
    background: var(--lidl-yellow);
    border-radius: 50%;
    color: var(--lidl-dark-blue);
    display: inline-flex;
    height: 22px;
    justify-content: center;
    width: 22px;
  }

  /* ── Kalendář — chipy událostí v buňce ─────────────────────────────────
     Barva chipu (--chip-color) přichází z EVENT_TYPES na serveru pro daný
     typ. Ikona i barva jsou jen doplněk — text (název události) je vždy
     čitelný i bez nich, takže výpadek ikonového fontu nic neschová. ── */

  .cal-chips {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-top: 4px;
    min-width: 0;
  }

  .cal-chip {
    align-items: center;
    background: color-mix(in srgb, var(--chip-color) 14%, white);
    border-radius: 4px;
    color: var(--chip-color);
    display: flex;
    font-size: 10px;
    font-weight: 700;
    gap: 4px;
    overflow: hidden;
    padding: 2px 5px;
    white-space: nowrap;
  }

  .cal-chip i {
    flex-shrink: 0;
    font-size: 10px;
  }

  .cal-chip span {
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cal-chip-more {
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    padding: 0 5px;
  }

  /* ── Modal — detail dne (nativní <dialog>, port z Výchozí aplikace 2.0) ─ */

  .modal {
    background: var(--white);
    border: none;
    border-radius: var(--radius);
    border-top: 4px solid var(--lidl-blue);
    box-shadow: 0 24px 80px rgba(0, 20, 80, 0.28), 0 4px 16px rgba(0, 20, 80, 0.12);
    max-height: calc(100vh - 48px);
    max-width: min(480px, calc(100vw - 32px));
    overflow: hidden;
    padding: 0;
    width: 100%;
  }

  .modal[open] {
    display: flex;
    flex-direction: column;
  }

  /* Širší varianta pro dvousloupcový modal detailu události. */
  .modal-wide {
    max-width: min(680px, calc(100vw - 32px));
  }

  .modal::backdrop {
    background: rgba(0, 24, 70, 0.5);
    backdrop-filter: blur(3px);
  }

  .modal-header {
    align-items: center;
    background-color: var(--lidl-dark-blue);
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 15px, rgba(255, 255, 255, 0.035) 15px, rgba(255, 255, 255, 0.035) 16px),
      repeating-linear-gradient(90deg, transparent, transparent 15px, rgba(255, 255, 255, 0.035) 15px, rgba(255, 255, 255, 0.035) 16px);
    display: flex;
    flex-shrink: 0;
    gap: 14px;
    overflow: hidden;
    padding: 13px 18px;
    position: relative;
  }

  .modal-header::before {
    background:
      radial-gradient(circle at 105% 120%, rgba(255, 240, 0, 0.18) 0%, transparent 45%),
      radial-gradient(circle at 92% -20%, rgba(255, 255, 255, 0.06) 0%, transparent 40%);
    content: "";
    inset: 0;
    pointer-events: none;
    position: absolute;
  }

  .modal-icon {
    align-items: center;
    background: var(--lidl-yellow);
    border-radius: var(--radius);
    color: var(--lidl-dark-blue);
    display: inline-flex;
    flex-shrink: 0;
    height: 38px;
    justify-content: center;
    position: relative;
    width: 38px;
    z-index: 1;
  }

  .modal-icon i {
    font-size: 18px;
  }

  /* V modalu detailu události je ikona barevná podle typu (--chip-color),
     ne pevně žlutá jako jinde — stejný jazyk barev jako chipy v mřížce. */
  .modal-icon.is-event-color {
    background: color-mix(in srgb, var(--chip-color) 18%, white);
    color: var(--chip-color);
  }

  .modal-header-text {
    flex: 1;
    min-width: 0;
    position: relative;
    z-index: 1;
  }

  .modal-header .kicker {
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 2px;
  }

  .modal-header h2 {
    color: var(--white);
    font-size: 16px;
    margin-bottom: 0;
  }

  .modal-close {
    align-items: center;
    background: transparent;
    border: none;
    border-radius: var(--radius);
    color: rgba(255, 255, 255, 0.55);
    cursor: pointer;
    display: inline-flex;
    flex-shrink: 0;
    height: 30px;
    justify-content: center;
    margin-left: auto;
    position: relative;
    transition: background 0.12s, color 0.12s;
    width: 30px;
    z-index: 1;
  }

  .modal-close:hover {
    background: rgba(255, 255, 255, 0.12);
    color: var(--white);
  }

  .modal-close i {
    font-size: 15px;
  }

  .modal-body {
    border-top: 1px solid var(--line-soft);
    color: var(--muted);
    font-size: 14px;
    min-height: 0;
    overflow-y: auto;
    padding: 8px 22px 20px;
  }

  /* Patička s akčními tlačítky (Zrušit/Vytvořit, "+ Nová událost" u dne).
     flex-shrink: 0, ať ji flex-column .modal[open] nikdy nesmáčkne. */
  .modal-actions {
    align-items: center;
    background: #f5f8fc;
    border-top: 1px solid var(--line-soft);
    display: flex;
    flex-shrink: 0;
    gap: 10px;
    justify-content: flex-end;
    padding: 14px 22px;
  }

  /* Pevná výška těla modalu detailu dne — místo pro cca 5 událostí (víc
     v jednom dni se v praxi nepředpokládá). Míň událostí nechá pod sebou
     volný prostor, prázdný stav (žádné události) se do něj sám vycentruje. */
  #dayModal .modal-body {
    display: flex;
    flex-direction: column;
    height: 350px;
  }

  @keyframes backdrop-enter {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @keyframes backdrop-leave {
    from { opacity: 1; }
    to   { opacity: 0; }
  }

  dialog[open]::backdrop {
    animation: backdrop-enter 0.3s ease both;
  }

  dialog[open].is-closing::backdrop {
    animation: backdrop-leave 0.22s ease both;
  }

  /* Modal se třídou "modal-grow" vyjede přesně z prvku (buňky dne nebo
     chipu), na který se kliklo — JS (setModalOrigin) před otevřením nastaví
     --modal-dx/--modal-dy na posun mezi středem toho prvku a středem
     obrazovky, kam prohlížeč dialog sám vycentruje. Animace jede OPAČNÝM
     směrem: od bodu kliknutí (malý, průhledný) do finální vycentrované
     podoby — vizuálně to vypadá, že okno vyrostlo přesně odtud. Zavření
     udělá stejnou cestu pozpátku. Sdíleno mezi #dayModal a #eventModal. */
  @keyframes modal-grow-from-cell {
    from { opacity: 0; transform: translate(var(--modal-dx, 0px), var(--modal-dy, 0px)) scale(0.15); }
    to   { opacity: 1; transform: translate(0, 0) scale(1); }
  }

  @keyframes modal-shrink-to-cell {
    from { opacity: 1; transform: translate(0, 0) scale(1); }
    to   { opacity: 0; transform: translate(var(--modal-dx, 0px), var(--modal-dy, 0px)) scale(0.15); }
  }

  .modal-grow[open] {
    animation: modal-grow-from-cell 0.38s cubic-bezier(0.22, 1.4, 0.36, 1) both;
  }

  .modal-grow[open].is-closing {
    animation: modal-shrink-to-cell 0.24s cubic-bezier(0.4, 0, 1, 1) both;
  }

  /* ── Modal — detail dne: seznam událostí ───────────────────────────── */

  /* Klikatelná — otevře detail té konkrétní události (viz openEventModal). */
  .day-event-item {
    border-bottom: 1px solid var(--line-soft);
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    gap: 12px;
    margin: 0 -8px;
    padding: 12px 8px;
    transition: background 0.12s;
  }

  .day-event-item:hover {
    background: var(--page);
  }

  .day-event-item:last-child {
    border-bottom: none;
  }

  .day-event-icon {
    align-items: center;
    background: color-mix(in srgb, var(--chip-color) 16%, white);
    border-radius: 8px;
    color: var(--chip-color);
    display: flex;
    flex-shrink: 0;
    height: 36px;
    justify-content: center;
    width: 36px;
  }

  .day-event-icon i {
    font-size: 17px;
  }

  .day-event-text {
    flex: 1;
    min-width: 0;
  }

  .day-event-title-row {
    align-items: baseline;
    display: flex;
    gap: 8px;
    justify-content: space-between;
  }

  .day-event-title-row strong {
    color: var(--text);
    font-size: 14px;
  }

  .day-event-time {
    color: var(--muted);
    flex-shrink: 0;
    font-size: 12px;
    white-space: nowrap;
  }

  .day-event-desc {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
    margin: 4px 0 0;
  }

  .day-event-owner {
    color: var(--lidl-blue);
    display: block;
    font-size: 11px;
    font-weight: 700;
    margin-top: 6px;
  }

  /* #dayModal .modal-body je teď flex sloupec s pevnou výškou (viz výše) —
     tohle je jeho jediné dítě, takže "flex: 1" ho roztáhne přes celou
     výšku a vycentruje, místo aby zůstal nalepený nahoře s prázdnem pod sebou. */
  .day-empty {
    align-items: center;
    color: var(--muted);
    display: flex;
    flex: 1;
    font-size: 13px;
    justify-content: center;
    text-align: center;
  }

  /* ── Modal — detail JEDNÉ události: info + komentáře ve dvou sloupcích ──
     Pevná výška jako u #dayModal (konzistentní velikost oken), ale širší
     (.modal-wide) a rozdělená na dva sloupce. Sloupec s komentáři je sám
     o sobě flex, aby se seznam mohl posouvat a formulář zůstal přilepený
     dole — stejný vzor jako běžné chatovací okno. ── */

  #eventModal .modal-body {
    border-top: none;
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: 420px;
    padding: 0;
  }

  /* Barevný pruh nahoře váže celý panel k barvě typu události (--chip-color
     dědí z #eventModal, nastaveno v openEventModal) — stejný jazyk jako
     ikona v hlavičce a chipy v mřížce, aby okno nepůsobilo jako holý text. */
  .event-modal-info {
    border-right: 1px solid var(--line-soft);
    border-top: 3px solid var(--chip-color, var(--lidl-blue));
    overflow-y: auto;
    padding: 18px 20px;
  }

  .event-info-block {
    margin-bottom: 22px;
  }

  .event-info-block:last-child {
    margin-bottom: 0;
  }

  /* Stejný vzor jako .kicker jinde v appce — malý popisek nad hodnotou. */
  .event-info-label {
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    margin: 0 0 5px;
    text-transform: uppercase;
  }

  .event-info-value {
    color: var(--text);
    font-size: 16px;
    font-weight: 700;
    margin: 0;
  }

  .event-info-sub {
    color: var(--muted);
    font-size: 12px;
    margin: 2px 0 0;
    text-transform: capitalize;
  }

  .event-info-value-row {
    align-items: center;
    display: flex;
    gap: 9px;
    margin: 0;
  }

  .event-info-avatar {
    align-items: center;
    background: var(--page);
    border-radius: 50%;
    color: var(--lidl-blue);
    display: inline-flex;
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    height: 27px;
    justify-content: center;
    width: 27px;
  }

  .event-info-text {
    color: var(--text);
    font-size: 13px;
    line-height: 1.6;
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .event-info-text--empty {
    color: var(--muted);
    font-style: italic;
  }

  .event-modal-comments {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .event-comments-list {
    display: flex;
    flex: 1;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
    padding: 16px 20px;
  }

  /* Prázdný/chybový stav komentářů — ikona + text, stejný jazyk jako .view-placeholder. */
  .comments-empty,
  .comments-loading {
    align-items: center;
    color: var(--muted);
    display: flex;
    flex: 1;
    flex-direction: column;
    font-size: 13px;
    gap: 8px;
    justify-content: center;
    text-align: center;
  }

  .comments-empty i {
    color: var(--line);
    font-size: 28px;
  }

  .comments-empty p {
    line-height: 1.5;
    margin: 0;
  }

  .comment-item {
    background: var(--page);
    border-radius: 8px;
    padding: 8px 10px;
  }

  .comment-item-header {
    align-items: baseline;
    display: flex;
    gap: 8px;
    justify-content: space-between;
  }

  .comment-item-header strong {
    color: var(--lidl-dark-blue);
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
